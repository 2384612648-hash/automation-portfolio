name: zero-station
services:
  zero:
    build: .
    image: zero-station:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      STATION_PUBLIC_ORIGIN: ${STATION_PUBLIC_ORIGIN:?Set the server HTTPS origin in .env}
    volumes:
      - station-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=4).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  station-data:
